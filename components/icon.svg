<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="256" height="256" rx="40" fill="#1f8f6a"/>

  <!-- White Circle -->
  <circle cx="128" cy="128" r="90" fill="#ffffff"/>

  <!-- Wallet -->
  <rect x="60" y="120" width="90" height="60" rx="10" fill="#1f8f6a"/>
  <rect x="60" y="120" width="90" height="20" rx="10" fill="#166f52"/>
  <circle cx="135" cy="150" r="5" fill="#ffffff"/>

  <!-- Money ($) -->
  <circle cx="105" cy="110" r="20" fill="#4caf50"/>
  <text x="105" y="118" font-size="20" text-anchor="middle" fill="#ffffff" font-family="Arial">$</text>

  <!-- Chart Bars -->
  <rect x="150" y="130" width="10" height="30" fill="#4caf50"/>
  <rect x="165" y="120" width="10" height="40" fill="#2e7d32"/>
  <rect x="180" y="110" width="10" height="50" fill="#1b5e20"/>

  <!-- Up Arrow -->
  <polyline points="150,120 170,100 190,110" fill="none" stroke="#1b5e20" stroke-width="3"/>
  <polygon points="190,110 185,100 200,105" fill="#1b5e20"/>
</svg>